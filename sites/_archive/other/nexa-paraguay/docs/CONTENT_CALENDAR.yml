posts:
  - id: 2026-05-01-villa-morra
    date: 2026-05-01T10:00-03:00
    platform: instagram
    image: social.villaMorra
    caption_es: "Una mañana en Villa Morra. El Paraguay que atrae inversión no es el Paraguay de los titulares. Es el de los patios, los cafés, los pequeños encuentros que hacen que quedarse tenga sentido."
    caption_en: "A morning in Villa Morra. The Paraguay that attracts investment isn't the one in the headlines. It's patios, cafés, small encounters that make staying make sense."
    caption_nl: "Een ochtend in Villa Morra. Het Paraguay dat investeringen aantrekt is niet het Paraguay van de krantenkoppen. Het zijn de patio's, de cafés, kleine ontmoetingen waardoor blijven zinvol wordt."
    caption_de: "Ein Morgen in Villa Morra. Das Paraguay, das Investitionen anzieht, ist nicht das der Schlagzeilen. Es sind die Höfe, die Cafés, kleine Begegnungen, die das Bleiben sinnvoll machen."
    hashtags: ["#expatparaguay", "#asuncion", "#villamorra", "#nexaparaguay"]

  - id: 2026-05-06-data-tip-tax
    date: 2026-05-06T10:00-03:00
    platform: linkedin
    image: social.dataTip
    caption_es: "Sistema fiscal territorial. En Paraguay, los ingresos generados fuera del país no pagan impuesto local. Es el dato que cambia la ecuación para muchos inversores europeos."
    caption_en: "Territorial tax system. In Paraguay, foreign-sourced income is not locally taxed. It's the single data point that changes the maths for many European investors."
    caption_nl: "Territoriaal belastingstelsel. In Paraguay wordt inkomen uit het buitenland lokaal niet belast. Het datapunt dat de rekensom verandert voor veel Europese investeerders."
    caption_de: "Territoriales Steuersystem. In Paraguay wird ausländisches Einkommen lokal nicht besteuert. Der Datenpunkt, der die Rechnung für viele europäische Investoren verändert."
    hashtags: ["#paraguay", "#taxstability", "#territorialtax", "#investment"]

  - id: 2026-05-11-bts-office
    date: 2026-05-11T10:00-03:00
    platform: instagram
    image: social.btsOffice
    caption_es: "Detrás de cámaras. La mayoría del trabajo no ocurre el día operativo, ocurre antes: prevalidación de documentos, coordinación con bancos y escribanías, mapeo de timing. Esa es la diferencia."
    caption_en: "Behind the scenes. Most of the work doesn't happen on operational day — it happens before: document pre-validation, coordination with banks and notaries, timing maps. That's the difference."
    caption_nl: "Achter de schermen. Het meeste werk gebeurt niet op de operationele dag — het gebeurt ervoor: documentvalidatie, coördinatie met banken en notarissen, timing. Daar zit het verschil."
    caption_de: "Hinter den Kulissen. Die meiste Arbeit passiert nicht am operativen Tag — sie passiert davor: Dokumentenvorvalidierung, Koordination mit Banken und Notaren, Timing. Das ist der Unterschied."
    hashtags: ["#behindthescenes", "#processmatters", "#nexaparaguay"]

  - id: 2026-05-16-carmelitas
    date: 2026-05-16T10:00-03:00
    platform: instagram
    image: social.carmelitas
    caption_es: "Carmelitas. Uno de los barrios más caminables de Asunción — árboles, embajadas, cafés sin turistas. El tipo de barrio que solo ves si te quedás lo suficiente."
    caption_en: "Carmelitas. One of the most walkable neighbourhoods in Asunción — trees, embassies, tourist-free cafés. The kind of place you only notice if you stay long enough."
    caption_nl: "Carmelitas. Een van de meest wandelbare buurten van Asunción — bomen, ambassades, cafés zonder toeristen. Zo'n plek die je alleen ziet als je lang genoeg blijft."
    caption_de: "Carmelitas. Eines der fußgängerfreundlichsten Viertel Asuncións — Bäume, Botschaften, touristenfreie Cafés. Die Art von Ort, den man nur bemerkt, wenn man lange genug bleibt."
    hashtags: ["#carmelitas", "#asuncion", "#expatlife", "#paraguay"]

  - id: 2026-05-21-client-journey
    date: 2026-05-21T10:00-03:00
    platform: linkedin
    image: social.clientJourney
    caption_es: "8 a 12 semanas de principio a fin. Del primer consulta a la entrega final de documentos. Sin sorpresas, sin viajes extra, sin 'voy a preguntarle al contador'. Un solo equipo, un solo programa."
    caption_en: "8 to 12 weeks end-to-end. From the first consultation to final document delivery. No surprises, no extra trips, no 'let me check with the accountant.' One team, one program."
    caption_nl: "8 tot 12 weken van begin tot eind. Van het eerste consult tot de levering van de definitieve documenten. Geen verrassingen, geen extra reizen, geen 'ik vraag het even aan de accountant'. Eén team, één programma."
    caption_de: "8 bis 12 Wochen von Anfang bis Ende. Vom ersten Gespräch bis zur Übergabe der finalen Dokumente. Keine Überraschungen, keine Extrafahrten, kein 'ich frage mal den Steuerberater'. Ein Team, ein Programm."
    hashtags: ["#relocation", "#paraguay", "#onetrip", "#endtoend"]

  - id: 2026-05-26-san-bernardino
    date: 2026-05-26T10:00-03:00
    platform: instagram
    image: social.sanBernardino
    caption_es: "San Bernardino. 45 minutos de Asunción, ritmo distinto, otra geografía mental. Muchos de nuestros clientes terminan eligiendo tener base acá y venir los fines de semana."
    caption_en: "San Bernardino. 45 minutes from Asunción, different pace, different mental geography. Many of our clients end up choosing to have a weekend base here."
    caption_nl: "San Bernardino. 45 minuten van Asunción, ander tempo, andere mentale geografie. Veel van onze klanten kiezen er uiteindelijk voor een weekendbasis hier te hebben."
    caption_de: "San Bernardino. 45 Minuten von Asunción, anderes Tempo, andere geistige Geografie. Viele unserer Klienten entscheiden sich am Ende für eine Wochenend-Basis hier."
    hashtags: ["#sanbernardino", "#paraguay", "#weekendbase", "#lifestyle"]

  - id: 2026-05-31-data-tip-cost
    date: 2026-05-31T10:00-03:00
    platform: linkedin
    image: social.dataTip
    caption_es: "Costo de vida vs. poder adquisitivo. El pesó no es el tema. El tema es cuánto rinde lo que ya tenés. Para ingresos en euros o dólares, Paraguay ofrece una ecuación distinta."
    caption_en: "Cost of living vs. purchasing power. The currency isn't the point. The point is how far what you already have goes. For euro or dollar incomes, Paraguay offers a different equation."
    caption_nl: "Kosten van levensonderhoud vs. koopkracht. Het gaat niet om de valuta. Het gaat erom hoe ver je bestaande inkomen reikt. Voor inkomen in euro of dollar biedt Paraguay een andere vergelijking."
    caption_de: "Lebenshaltungskosten vs. Kaufkraft. Nicht die Währung zählt. Es zählt, wie weit das reicht, was Sie bereits haben. Für Einkommen in Euro oder Dollar bietet Paraguay eine andere Gleichung."
    hashtags: ["#costofliving", "#paraguay", "#purchasingpower"]

  - id: 2026-06-05-villa-morra
    date: 2026-06-05T10:00-03:00
    platform: instagram
    image: social.villaMorra
    caption_es: "Tereré al atardecer. El ritual que resetea el día. Si no existe algo parecido en tu rutina actual, tal vez Paraguay ofrezca algo más que estructura fiscal."
    caption_en: "Tereré at sunset. The ritual that resets the day. If there's no equivalent in your current routine, maybe Paraguay offers more than fiscal structure."
    caption_nl: "Tereré bij zonsondergang. Het ritueel dat de dag reset. Als er geen equivalent is in je huidige routine, biedt Paraguay misschien meer dan alleen fiscale structuur."
    caption_de: "Tereré bei Sonnenuntergang. Das Ritual, das den Tag neu startet. Wenn es in Ihrer aktuellen Routine kein Pendant gibt, bietet Paraguay vielleicht mehr als nur steuerliche Struktur."
    hashtags: ["#terere", "#paraguay", "#slowliving", "#lifestyle"]

  - id: 2026-06-10-bts-office
    date: 2026-06-10T10:00-03:00
    platform: linkedin
    image: social.btsOffice
    caption_es: "Pre-validación. Antes de que nuestro cliente suba al avión, cada documento está revisado, apostillado y pre-conformado. Si falta algo, lo detectamos antes del viaje, no durante."
    caption_en: "Pre-validation. Before our client boards the plane, every document is reviewed, apostilled and pre-approved. If something's missing, we catch it before the trip — not during."
    caption_nl: "Prevalidatie. Voordat onze klant het vliegtuig instapt, is elk document gecontroleerd, geapostilleerd en vooraf goedgekeurd. Als iets ontbreekt, merken we dat vóór de reis, niet tijdens."
    caption_de: "Vorvalidierung. Bevor unser Klient ins Flugzeug steigt, ist jedes Dokument geprüft, apostilliert und vorab freigegeben. Wenn etwas fehlt, fangen wir es vor der Reise ab — nicht währenddessen."
    hashtags: ["#prevalidation", "#processmatters", "#paraguay"]

  - id: 2026-06-15-client-journey
    date: 2026-06-15T10:00-03:00
    platform: instagram
    image: social.clientJourney
    caption_es: "De carpeta a cédula. El día operativo comprime en 8-10 horas lo que tradicionalmente requería 3 viajes. No es magia: es logística institucional aplicada bien."
    caption_en: "From folder to ID card. Operational day compresses into 8–10 hours what traditionally required 3 separate trips. It's not magic — it's well-applied institutional logistics."
    caption_nl: "Van map naar ID-kaart. De operationele dag comprimeert in 8–10 uur wat vroeger 3 afzonderlijke reizen vergde. Geen magie — goed toegepaste institutionele logistiek."
    caption_de: "Vom Ordner zum Ausweis. Der operative Tag verdichtet in 8–10 Stunden, was traditionell 3 separate Reisen erforderte. Keine Magie — gut angewandte institutionelle Logistik."
    hashtags: ["#operationalday", "#relocation", "#paraguay"]

