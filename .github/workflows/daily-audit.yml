name: Daily Site Audit

on:
  schedule:
    # Run every day at 06:00 PYST (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Site health check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Run demo health check (API-based)
        run: |
          curl -s https://paragu-ai.com/api/admin/audit-demo | jq '.'
      - name: Start dev server for Playwright tests
        run: |
          npm run dev &
          npx wait-on http://localhost:3000 --timeout=60000
      - name: Run Playwright demo health check
        run: npx playwright test tests/e2e/demo-health-check.spec.ts --reporter=json
      - name: Run accessibility audit
        run: npx playwright test tests/accessibility/demo-a11y-audit.spec.ts --reporter=json
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: |
            web/tests/e2e/__audit__/
            web/tests/accessibility/__audit__/
          retention-days: 30
      - name: Notify on failures
        if: failure()
        run: |
          echo "::error::Demo audit failed! Check artifacts for details."
