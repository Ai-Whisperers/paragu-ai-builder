name: Test — paragu-ai-builder

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Run tests (skip if no test files exist)
        run: |
          if [ -d "tests" ] && find tests -name "*.test.*" -o -name "*.spec.*" | grep -q .; then
            npm run test
          else
            echo "No test files found — skipping tests"
          fi

      - run: npm run build
