name: Deploy

# Automatic deploy on push to Main. Also manually triggerable.
#
# Two parallel jobs:
#   1. Cloudflare Pages — builds and deploys the OpenNext worker
#   2. VPS Hostinger — SSHes into the VPS, pulls latest, rebuilds Docker
#      image, and rolls the swarm service (zero-downtime).
on:
  push:
    branches: [Main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Cloudflare Pages ────────────────────────────────────────────
  cloudflare:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js
        working-directory: web
        run: npm run build

      - name: Build OpenNext worker
        working-directory: web
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

  # ── VPS (Hostinger Docker Swarm) ───────────────────────────────
  vps:
    name: VPS Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 72.61.44.159 >> ~/.ssh/known_hosts

      - name: Run deploy script on VPS
        run: |
          ssh root@72.61.44.159 'bash /opt/stacks/paragu-ai-builder/deploy.sh prod'
