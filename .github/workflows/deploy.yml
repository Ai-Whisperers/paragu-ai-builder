name: Deploy — paragu-ai-builder

on:
  workflow_run:
    workflows: ["Test — paragu-ai-builder"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build Docker image
        run: |
          cp ../CHANGELOG.md ./
          docker build -f Dockerfile.prod -t ghcr.io/ai-whisperers/paragu-ai:latest .

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/ai-whisperers/paragu-ai:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.61.44.159
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/ai-whisperers/paragu-ai:latest
            docker tag ghcr.io/ai-whisperers/paragu-ai:latest paragu-ai:prod
            cd /root/paragu-ai-builder
            docker stack rm paragu-ai-builder 2>/dev/null || true
            sleep 5
            docker stack deploy -c docker-compose.yml paragu-ai-builder
