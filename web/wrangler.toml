#:schema node_modules/wrangler/config-schema.json
# Minimal wrangler config for @opennextjs/cloudflare.
# The real deployment target (paragu-ai.pages.dev / *.workers.dev) is
# configured in the Cloudflare dashboard; this file just satisfies the
# adapter's requirement for a wrangler config to bind assets and the
# entrypoint worker.
name = "paragu-ai-builder"
main = ".open-next/worker.js"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

# Static asset binding required by @opennextjs/cloudflare
[assets]
binding = "ASSETS"
directory = ".open-next/assets"
