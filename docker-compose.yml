version: '3.8'
services:
  web:
    image: paragu-ai:prod
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://paragu-ai.com
      - NEXT_PUBLIC_SUPABASE_URL=https://qyvokpribmbrosafntqa.supabase.co
    secrets:
      - supabase_anon_key
      - supabase_service_key
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

secrets:
  supabase_anon_key:
    file: /root/.hermes/secrets/supabase_anon_key.txt
  supabase_service_key:
    file: /root/.hermes/secrets/supabase_service_key.txt
