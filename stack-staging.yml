    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
      labels:
        - traefik.enable=true
        - traefik.docker.network=agent-net
        - traefik.http.services.paragu-ai-staging.loadbalancer.server.port=3000
        - traefik.http.routers.paragu-ai-staging.rule=Host(`staging.paragu-ai.com`)
        - traefik.http.routers.paragu-ai-staging.entrypoints=websecure
        - traefik.http.routers.paragu-ai-staging.tls=true
        - traefik.http.routers.paragu-ai-staging.tls.certresolver=letsencryptresolver
        - traefik.http.routers.paragu-ai-staging.service=paragu-ai-staging

networks:
  agent-net:
